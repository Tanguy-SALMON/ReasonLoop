[project]
name = "reasonloop"
version = "0.3.0"
description = "A modular AI agent system with task orchestration and web crawling capabilities"
authors = [
    {name = "Tanguy SALMON", email = "tanguy.salmon@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "playwright>=1.40.0",
    "nest-asyncio>=1.6.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
reasonloop = "main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "reasonloop"
packages = [
    {include = "reasonloop"},
    {include = "abilities"},
    {include = "core"},
    {include = "utils"},
    {include = "config"},
    {include = "models"},
    {include = "api"},
    {include = "agents"},
]

# Include agent templates as package data
include = ["agents/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
